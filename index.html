<style id="appStyles">
:root{--gold:#D4AF37;--bg:#0A0A0A;--card:#121212;--text:#fff;--hero-bg:#D4AF37;--hero-text:#000;--radius:14px;--font-title:'Anton',sans-serif;--font-body:'Inter',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);max-width:520px;margin:0 auto;min-height:100vh;transition:background 0.3s,color 0.3s}
.header{padding:24px 20px;background:#000;border-bottom:1px solid #1a1a1a;display:flex;justify-content:space-between;align-items:center}
.logo{font-family:var(--font-title);font-size:40px;letter-spacing:-1px;line-height:0.9}
.logo span{color:var(--gold)}
.sub{font-size:10px;letter-spacing:3px;color:#666;margin-top:8px;font-weight:600}
.tabs{display:flex;gap:1px;background:#1a1a1a;padding:1px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:68px;background:var(--bg);padding:14px 6px;text-align:center;font-size:10px;letter-spacing:1.2px;font-weight:800;color:#555;cursor:pointer;white-space:nowrap;transition:all 0.2s}
.tab.active{background:#fff;color:#000}
.hero{padding:28px 20px;background:var(--hero-bg);color:var(--hero-text);transition:all 0.3s}
.hero.pink{background:#FF8FAB;color:#000}
.hero.black{background:#fff;color:#000}
.hero h1{font-family:var(--font-title);font-size:36px;line-height:0.9;letter-spacing:-1px}
.hero p{font-size:12px;margin-top:12px;line-height:1.5;font-weight:600;max-width:320px;font-family:var(--font-body)}
.card{background:var(--card);border-bottom:1px solid #1a1a1a;padding:20px;border-radius:var(--radius);transition:all 0.3s}
.card-title{font-family:var(--font-title);font-size:18px;letter-spacing:1px;margin-bottom:12px}
.line{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #1a1a1a}
.galeria{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#1a1a1a;border-radius:var(--radius);overflow:hidden}
.foto{aspect-ratio:1;background:#111;position:relative;overflow:hidden}
.foto img{width:100%;height:100%;object-fit:cover}
.foto .cap{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,black);padding:20px 10px 10px}
.foto .cap b{font-family:var(--font-title);font-size:12px}
input,select,textarea{width:100%;background:#000;color:#fff;border:1px solid #222;padding:14px;margin-bottom:10px;font-size:14px;border-radius:8px;font-family:var(--font-body)}
button{width:100%;background:var(--gold);color:#000;border:0;padding:16px;font-family:var(--font-title);letter-spacing:1px;font-size:14px;cursor:pointer;border-radius:8px;transition:all 0.2s}
button.sec{background:#000;color:#fff;border:1px solid #333;font-family:var(--font-body);font-weight:800;font-size:11px;letter-spacing:1px}
button.pink{background:#FF8FAB;color:#000}
.preview{width:100%;max-height:360px;object-fit:cover;display:none;margin-bottom:12px;border-radius:var(--radius)}
.small{font-size:11px;color:#777;line-height:1.5}
.pizarron{background:#fff;color:#000;padding:20px;border-radius:var(--radius)}
.pizarron .title{font-family:var(--font-title);font-size:20px;letter-spacing:1px}
.install{background:var(--gold);color:#000;padding:12px 16px;display:none;justify-content:space-between;align-items:center;font-weight:800;font-size:11px;letter-spacing:1px}
.gold-card{background:linear-gradient(135deg,var(--gold) 0%,#F5D76E 30%,var(--gold) 60%,#8A6D00 100%);color:#000;border-radius:var(--radius);padding:18px;position:relative;overflow:hidden;margin-bottom:12px;box-shadow:0 8px 20px rgba(212,175,55,0.3)}
.gold-card.vip{background:linear-gradient(135deg,#000 0%,#1a1a1a 100%);color:var(--gold);border:2px solid var(--gold)}
.gold-card .dots{display:flex;gap:8px;margin:12px 0}
.gold-card .dot{width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,0.15);display:grid;place-items:center;font-weight:800;font-size:12px;border:2px solid rgba(0,0,0,0.1)}
.gold-card .dot.done{background:#000;color:var(--gold);border-color:#000}
.gold-card.vip .dot{background:rgba(212,175,55,0.15);border-color:rgba(212,175,55,0.3);color:#555}
.gold-card.vip .dot.done{background:var(--gold);color:#000}
.badge-vip{background:#000;color:var(--gold);font-size:9px;padding:4px 8px;border-radius:20px;font-weight:800;letter-spacing:1px}
.promo-card{background:#fff;color:#000;border-radius:var(--radius);padding:18px;margin-bottom:12px;position:relative;border-left:6px solid var(--gold)}
.promo-card.pink{border-left-color:#FF8FAB}
.promo-card.gold{background:linear-gradient(135deg,var(--gold),#F5D76E);border-left-color:#000}
.promo-card .price{font-family:var(--font-title);font-size:28px;line-height:1}
.promo-card .old{text-decoration:line-through;color:#999;font-size:12px}
.admin-block{background:#fff;color:#000;border-radius:12px;padding:16px;margin-bottom:16px}
.admin-block .title{color:#000;font-family:var(--font-title);font-size:16px;margin-bottom:10px}
.color-dot{width:28px;height:28px;border-radius:50%;display:inline-block;cursor:pointer;border:2px solid #fff;box-shadow:0 0 0 1px #ddd;margin:4px}
.font-opt{padding:8px 12px;border:1px solid #ddd;border-radius:8px;margin:4px;display:inline-block;cursor:pointer;font-size:12px;background:#f9f9f9}
.font-opt.active{background:#000;color:#fff;border-color:#000}
.design-preview{width:100%;height:60px;border-radius:8px;margin:4px 0;display:grid;place-items:center;font-family:var(--font-title);cursor:pointer;border:2px solid transparent}
.design-preview.active{border-color:#000}
</style>
</head>

     currentConfig={gold:data.gold||currentConfig.gold, bg:data.bg||currentConfig.bg, hero_bg:data.hero_bg||currentConfig.hero_bg, hero_text:data.hero_text||currentConfig.hero_text, font_title:data.font_title||currentConfig.font_title, font_body:data.font_body||currentConfig.font_body, radius:data.radius||currentConfig.radius, logo:data.logo||currentConfig.logo, logo_span:data.logo_span||currentConfig.logo_span, logo_sub:data.logo_sub||currentConfig.logo_sub, hero_title:data.hero_title||currentConfig.hero_title, hero_sub:data.hero_sub||currentConfig.hero_sub};
     applyConfigToDOM();

     document.getElementById('editLogoSpan').value=currentConfig.logo_span;
     document.getElementById('editLogoSub').value=currentConfig.logo_sub;
     document.getElementById('editHeroTitle').value=currentConfig.hero_title;

 }catch(e){}

 try{

 }catch(e){
   document.getElementById('designStatus').innerText='⚠️ Guardado local (corre el SQL de app_config en Supabase para que sea global). Error: '+e.message;
 }
}

 try{if(p.id){await supabaseClient.from('promos').update({titulo,descripcion:desc,precio,precio_old:old,estilo}).eq('id',p.id);} else{await supabaseClient.from('promos').update({titulo,descripcion:desc,precio,precio_old:old,estilo}).eq('titulo',p.titulo);}}catch(e){}
